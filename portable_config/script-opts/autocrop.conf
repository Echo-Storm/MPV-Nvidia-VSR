# Whether to automatically apply crop at the start of playback.
auto=yes
# Delay (seconds) before starting crop in auto mode. Increase to avoid
# dark scenes or fade-ins at the start being mistaken for letterboxing.
# Total time before crop lands is auto_delay + detect_seconds below.
# Kept low (total ~2s) so it lands before auto_nvidia_vsr.lua's own 3s
# trigger fires -- avoids a visible rescale "pop" if VSR's upscale
# decision would otherwise change once the crop lands a beat later.
# Raise this if a specific release's long fade-in gets mis-detected.
auto_delay=1
# Black threshold for cropdetect. Smaller values generally crop less.
detect_limit=24/255
# The value which width/height should be divisible by. Smaller values
# have better detection accuracy.
detect_round=2
# The ratio of the minimum clip size to the original (0 to 1). If the
# picture is over-cropped, try raising this.
detect_min_ratio=0.5
# How long (seconds) to gather cropdetect data.
detect_seconds=1
# Whether to suppress the OSD message when crop is applied/removed.
suppress_osd=no
